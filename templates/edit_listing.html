{% extends 'base.html' %}

{% block content %}

<div class="container my-5" style="max-width: 700px;">

    <h2 class="mb-4">Edit Listing</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="mb-3">
            <label for="title" class="form-label">
                Title
            </label>

            <input
                type="text"
                class="form-control"
                id="title"
                name="title"
                value="{{ listing.title }}"
                required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">
                Description
            </label>

            <textarea
                class="form-control"
                id="description"
                name="description"
                rows="5"
                required>{{ listing.description }}</textarea>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">
                Category
            </label>

            <select
                class="form-select"
                id="category"
                name="category"
                required>

                {% for value, label in listing.CATEGORY_CHOICES %}
                    <option value="{{ value }}"
                        {% if listing.category == value %}selected{% endif %}>
                        {{ label }}
                    </option>
                {% endfor %}

            </select>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">
                Price
            </label>

            <input
                type="number"
                class="form-control"
                id="price"
                name="price"
                value="{{ listing.price }}"
                required>
        </div>

        <div class="mb-3">
            <label for="location" class="form-label">
                Location
            </label>

            <input
                type="text"
                class="form-control"
                id="location"
                name="location"
                value="{{ listing.location }}"
                required>
        </div>

        <div class="mb-3">
            <label for="image" class="form-label">
                Change Image
            </label>

            <input
                type="file"
                class="form-control"
                id="image"
                name="image"
                accept="image/*">
        </div>

        {% if listing.image %}
            <div class="mb-3">
                <p>Current Image:</p>

                <img
                    src="{{ listing.image.url }}"
                    alt="{{ listing.title }}"
                    style="max-width: 250px;"
                    class="img-thumbnail">
            </div>
        {% endif %}

        <button type="submit" class="btn btn-success">
            Save Changes
        </button>

        <a href="{% url 'my_listings' %}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
