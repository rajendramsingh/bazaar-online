{% extends 'base.html' %}

{% block content %}

<div class="container my-5">

    <div class="row">

        <div class="col-md-6">

            {% if listing.image %}
                <img
                    src="{{ listing.image.url }}"
                    class="img-fluid rounded"
                    alt="{{ listing.title }}"
                >
            {% endif %}

        </div>

        <div class="col-md-6">

            <h2>{{ listing.title }}</h2>

            <h4 class="text-success">
                Rs. {{ listing.price }}
            </h4>

            <p>
                {{ listing.description }}
            </p>

            <p>
                <strong>Location:</strong>
                {{ listing.location }}
            </p>

            <p>
                <strong>Category:</strong>
                {{ listing.category }}
            </p>

        </div>

    </div>

</div>

{% endblock %}
